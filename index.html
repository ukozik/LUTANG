
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>LUTANG — Welcome</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 55px;
      font-weight: 900;
      letter-spacing: 5px;
      background: linear-gradient(
        90deg, #e52b35, #ffd500, #169447
      );
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 45px;
    }

    .welcome {
      border: 1px solid #333;
      border-radius: 22px;
      padding: 35px 22px;
      background:
        radial-gradient(circle at top left, #e52b3530, transparent 45%),
        radial-gradient(circle at bottom right, #16944730, transparent 45%),
        #111;
    }

    .welcome h1 {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #bbb;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .login {
      background: linear-gradient(90deg, #e52b35, #ffd500);
      color: #000;
      border: none;
    }

    .register {
      background: transparent;
      color: white;
      border: 2px solid #169447;
    }

    .footer {
      color: #666;
      font-size: 11px;
      margin-top: 30px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">LUTANG</div>
    <div class="tagline">SCROLL • CHILL • SHARE</div>

    <section class="welcome">
      <h1>WELCOME TO LUTANG!</h1>

      <p>
        Your World of Short Videos.<br>
        Discover, Create and Share.
      </p>

      <a href="login.html" class="btn login">
        LOGIN
      </a>

      <a href="register.html" class="btn register">
        CREATE ACCOUNT
      </a>
    </section>

    <div class="footer">
      YOUR WORLD. YOUR VIDEOS. YOUR LUTANG.
    </div>

  </main>

</body>
</html>
