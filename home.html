
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>LUTANG</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      display: none;

    .page.active {
      display: block;

    /* HOME VIDEO FEED */
    #home {
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    #home::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      height: 100dvh;
      width: 100%;
      position: relative;
      overflow: hidden;
      scroll-snap-align: start;
      background:
        radial-gradient(circle at 50% 35%, #333 0%, #151515 35%, #000 85%);
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffd500;
      font-size: 14px;
    }

    .play-symbol {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .video-info {
      position: absolute;
      left: 15px;
      bottom: 85px;
      right: 85px;
      z-index: 2;
    }

    .creator {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e52b35, #ffd500, #169447);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: black;
    }

    .username {
      font-weight: bold;
      font-size: 14px;
    }

    .follow {
      border: 1px solid #fff;
      border-radius: 5px;
      background: transparent;
      color: white;
      padding: 6px 10px;
      font-size: 12px;
    }

    .caption {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .audio {
      font-size: 12px;
      color: #ddd;
    }

    .actions {
      position: absolute;
      right: 12px;
      bottom: 95px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 19px;
      z-index: 3;
    }

    .action {
      border: none;
      background: transparent;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    .action small {
      display: block;
      font-size: 11px;
      margin-top: 4px;
    }

    .action.selected {
      color: #e52b35;
    }

    /* MORE PAGE */
    #more {
      min-height: 100dvh;
      padding: 25px 18px 100px;
      background: #080808;
    }

    .more-header {
      text-align: center;
      padding: 20px 0 30px;
      border-bottom: 1px solid #333;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #e52b35, #ffd500, #169447);
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 3px;
      margin-top: 5px;
    }

    .menu-item {
      width: 100%;
      display: block;
      padding: 17px;
      margin-bottom: 10px;
      border: 1px solid #292929;
      border-radius: 10px;
      background: #151515;
      color: white;
      text-align: left;
      font-size: 15px;
    }

    /* OTHER TABS */
    .simple-page {
      min-height: 100dvh;
      padding: 30px 20px 100px;
      text-align: center;
      background: #080808;
    }

    .simple-page h2 {
      margin: 20px 0;
    }

    .simple-page p {
      color: #aaa;
      font-size: 14px;
    }

    /* BOTTOM NAVIGATION */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(15, 15, 15, 0.97);
      border-top: 1px solid #333;
      z-index: 10;
    }

    nav button {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
    }

    nav button span {
      display: block;
      font-size: 23px;
      margin-bottom: 3px;
    }

    nav button.active {
      color: #ffd500;
    }

  <!-- MORE -->

    <header class="more-header">
      <div class="logo">LUTANG</div>

    </header>

    <button class="menu-item">👤 My Profile</button>

  <script>
    function showTab(tabId, button) {
      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
      });

      document.getElementById(tabId).classList.add("active");

      document.querySelectorAll("nav button").forEach(navButton => {
        navButton.classList.remove("active");
      });

      button.classList.add("active");
      if (tabId === "create") {
  startCamera();
} else {
  stopCamera();
}
    }
    let cameraStream = null;
let currentCamera = "environment";

async function startCamera() {
  const preview = document.getElementById("cameraPreview");

  try {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: currentCamera
      },
      audio: false
    });

    preview.srcObject = cameraStream;
    await preview.play();

  } catch (error) {
    alert("Hindi ma-access ang camera. Paki-check ang camera permission.");
    console.error(error);
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  document.getElementById("cameraPreview").srcObject = null;
}
document.getElementById("galleryButton").addEventListener("click", () => {
  document.getElementById("videoFile").click();
});
    document.getElementById("videoFile").addEventListener("change", function() {
  const file = this.files[0];

  if (!file) return;

  const preview = document.getElementById("cameraPreview");
  const form = document.getElementById("uploadForm");
  document.getElementById("create").classList.add("has-selected-video");

  stopCamera();

  preview.src = URL.createObjectURL(file);
  preview.controls = true;
  preview.muted = false;
  preview.play();
  preview.style.objectFit = "contain";

  form.style.display = "block";
});
    function toggleLike(button) {
      button.classList.toggle("selected");

      const count = button.querySelector("small");
      const current = Number(count.textContent);

      count.textContent = button.classList.contains("selected")
        ? current + 1
        : Math.max(0, current - 1);
    }

    function toggleFollow(button) {
      button.textContent =
        button.textContent === "Follow" ? "Following" : "Follow";
    }

    function toggleSave(button) {
      button.classList.toggle("selected");
      button.querySelector("small").textContent =
        button.classList.contains("selected") ? "Saved" : "Save";
    }

    function showComments() {
      alert("Comments feature is coming soon!");
    }

    async function shareVideo() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: "LUTANG",
            text: "Check out LUTANG!"
          });
        } catch (error) {
          // Sharing was cancelled.
        }
      } else {
        alert("Sharing is not supported on this browser yet.");
      }
    }

    async function logout() {
      if (!confirm("Are you sure you want to logout?")) return;

      const { error } = await db.auth.signOut();

      if (error) {
        alert(error.message);
        return;
      }

      window.location.href = "login.html";
    }

    document.getElementById("uploadForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const file = document.getElementById("videoFile").files[0];
  const caption = document.getElementById("videoCaption").value.trim();
  const status = document.getElementById("uploadStatus");
  const button = document.getElementById("uploadBtn");

  if (!file) {
    status.textContent = "Pumili muna ng video.";
    return;
  }

  if (file.size > 50 * 1024 * 1024) {
    status.textContent = "Maximum video size ay 50 MB.";
    return;
  }

  button.disabled = true;
  status.textContent = "Uploading video...";

  try {
    const { data: userData, error: userError } = await db.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("Mag-login muna bago mag-upload.");
    }

    const user = userData.user;
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const filePath = `${user.id}/${Date.now()}-${safeName}`;

    const { error: uploadError } = await db.storage
      .from("lutang-videos")
      .upload(filePath, file, { upsert: false });

    if (uploadError) throw uploadError;

    const { error: insertError } = await db
      .from("videos")
      .insert({
        user_id: user.id,
        video_path: filePath,
        caption: caption
      });

    if (insertError) throw insertError;

    status.textContent = "Video uploaded successfully!";
    await loadVideoFeed();
    document.getElementById("uploadForm").reset();

  } catch (error) {
    status.textContent = "Upload failed: " + error.message;
  } finally {
    button.disabled = false;
  }
});
    async function loadVideoFeed() {
  const feed = document.getElementById("videoFeed");
  if (!feed) return;

  feed.innerHTML = "<p>Loading videos...</p>";

  const { data: videos, error } = await db
    .from("videos")
    .select("id, user_id, video_path, caption, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    feed.innerHTML = "<p>Hindi ma-load ang videos: " + error.message + "</p>";
    return;
  }

  if (!videos || videos.length === 0) {
    feed.innerHTML = "<p>Wala pang uploaded videos.</p>";
    return;
  }

  feed.innerHTML = "";

for (const video of videos) {
    const { data, error: urlError } = await db.storage
  .from("lutang-videos")
  .createSignedUrl(video.video_path, 3600);

if (urlError) {
  console.error("Video URL error:", urlError);
  continue;
}

    const card = document.createElement("section");
    card.className = "video-card";

    const player = document.createElement("video");
    player.src = data.signedUrl;
    player.controls = true;
    player.playsInline = true;
    player.preload = "metadata";
    player.style.width = "100%";

    const caption = document.createElement("p");
    caption.className = "caption";
    caption.textContent = video.caption || "";

    card.appendChild(player);
    card.appendChild(caption);
    feed.appendChild(card);
  }
  }
async function loadDiscoverFeed(searchText = "") {
  const feed = document.getElementById("discoverFeed");
  if (!feed) return;

  const { data: videos, error } = await db
    .from("videos")
    .select("id, video_path, caption, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    feed.textContent = "Hindi ma-load ang videos.";
    return;
  }

  const keyword = searchText.trim().toLowerCase();

  const filteredVideos = (videos || []).filter(video =>
    (video.caption || "").toLowerCase().includes(keyword)
  );

  feed.innerHTML = "";

  if (filteredVideos.length === 0) {
    feed.textContent = "Walang nahanap na video.";
    return;
  }

  for (const video of filteredVideos) {
  const { data, error: urlError } = await db.storage
    .from("lutang-videos")
    .createSignedUrl(video.video_path, 3600);

  if (urlError) {
    console.error("Video URL error:", urlError);
    continue;
  }

  const card = document.createElement("section");
  card.className = "video-card";

  const player = document.createElement("video");
  player.src = data.signedUrl;
  player.controls = true;
  player.playsInline = true;
  player.preload = "metadata";
  player.style.width = "100%";

  const title = document.createElement("p");
  title.className = "caption";
  title.textContent = video.caption || "Untitled video";

  card.appendChild(player);
  card.appendChild(title);
  feed.appendChild(card);
 }
 }
